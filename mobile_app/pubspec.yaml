name: ai_interview_coach_mobile
description: "AI Mock Interview & Coaching Mobile Application built with Flutter & Tailwind-style design system"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.5
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  camera: ^0.10.5+9
  flutter_tts: ^3.8.5
  speech_to_text: ^6.6.0
  google_fonts: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
